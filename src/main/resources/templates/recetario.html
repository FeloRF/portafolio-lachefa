<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Recetario - La Chefa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .recipe-card { transition: transform 0.3s; border: none; overflow: hidden; }
        .recipe-card:hover { transform: scale(1.03); }
        .badge-salsa { background-color: #dc3545; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand fw-bold" href="/">🌶️ LA CHEFA</a>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="menuPrincipal">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title">MENÚ</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-2"><a href="/" class="nav-link text-white"><i class="bi bi-house-door me-2"></i> HOME</a></li>
                <li class="nav-item mb-2"><a th:href="@{/catalogoLaChefa}" class="nav-link text-white"><i class="bi bi-shop me-2"></i> CATÁLOGO</a></li>
                <li class="nav-item mb-2"><a th:href="@{/recetario}" class="nav-link text-white active"><i class="bi bi-journal-text me-2"></i> RECETARIO</a></li>
            </ul>
        </div>
    </div>

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold text-dark">Libro de Sabores</h1>
            <p class="text-muted">Aprende a combinar nuestras salsas con tus platos favoritos</p>
        </header>

        <div class="row g-4">
            <div th:each="r : ${recetas}" class="col-md-4">
                <div class="card h-100 shadow-sm recipe-card">
                    <div class="bg-secondary text-white p-5 text-center">
                        <i class="bi bi-egg-fried display-1 opacity-25"></i>
                    </div>
                    <div class="card-body">
                        <span class="badge badge-salsa mb-2" th:text="'Salsa: ' + ${r.salsa}"></span>
                        <h5 class="card-title fw-bold" th:text="${r.nombre}"></h5>
                        <div class="d-flex justify-content-between small text-muted mt-3">
                            <span><i class="bi bi-bar-chart"></i> <span th:text="${r.dificultad}"></span></span>
                            <span><i class="bi bi-clock"></i> <span th:text="${r.tiempo}"></span></span>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 pb-3">
                        <button class="btn btn-outline-dark btn-sm w-100 disabled">Ver Receta (Próximamente)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
