<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments :: head_comun}"></th:block>
    <title th:text="${titulo}">Recetario - La Chefa</title>
</head>
<body class="bg-light">

    <div th:replace="~{fragments :: nav_publico}"></div>

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold text-dark">Libro de Sabores</h1>
            <p class="text-muted">Aprende a combinar nuestras salsas con tus platos favoritos</p>
        </header>

        <div class="row g-4">
            <div th:each="r : ${recetas}" class="col-md-4">
                <div class="card h-100 shadow-sm border-0 overflow-hidden">
                    <div class="bg-secondary text-white p-5 text-center">
                        <i class="bi bi-egg-fried display-1 opacity-25"></i>
                    </div>
                    <div class="card-body">
                        <span class="badge bg-danger mb-2" th:text="'Salsa: ' + ${r.salsa}"></span>
                        <h5 class="card-title fw-bold" th:text="${r.nombre}"></h5>
                        <div class="d-flex justify-content-between small text-muted mt-3">
                            <span><i class="bi bi-bar-chart"></i> <span th:text="${r.dificultad}"></span></span>
                            <span><i class="bi bi-clock"></i> <span th:text="${r.tiempo}"></span></span>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 pb-3">
					    <a th:href="@{/recetario/detalle/{id}(id=${r.id})}" 
					       class="btn btn-outline-dark btn-sm w-100">
					       <i class="bi bi-journal-text me-2"></i> Ver Receta
					    </a>
					</div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(recetas)}" class="text-center py-5">
            <p class="text-muted">Pronto subiremos nuestras recetas secretas...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
