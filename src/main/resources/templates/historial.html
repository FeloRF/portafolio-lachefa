<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments :: head_comun}"></th:block>
    <title th:text="${titulo}">Historial de Ventas - La Chefa</title>
</head>
<body class="bg-light">

    <div th:replace="~{fragments :: header_premium}"></div>

    <div class="container py-4">
        <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <div>
                <h1 class="h2 mb-0" th:text="${titulo}">Libro de Ventas</h1>
                <p class="text-muted small mb-0">Auditoría y Seguimiento de Ingresos</p>
            </div>
            <a th:href="@{/productos/catalogo}" class="btn btn-outline-dark btn-sm">
                <i class="bi bi-arrow-left"></i> Volver al Inventario
            </a>
        </header>

        <section class="card shadow-sm border-0 mb-4">
            <div class="card-body d-flex align-items-center flex-wrap gap-2">
                <span class="fw-bold me-2"><i class="bi bi-funnel"></i> Filtrar:</span>
                <a th:href="@{/ventas/historial(periodo='hoy')}" class="btn btn-sm btn-outline-secondary">Hoy</a>
                <a th:href="@{/ventas/historial(periodo='semana')}" class="btn btn-sm btn-outline-secondary">Esta Semana</a>
                <a th:href="@{/ventas/historial(periodo='mes')}" class="btn btn-sm btn-outline-secondary">Este Mes</a>
                <a th:href="@{/ventas/historial}" class="btn btn-sm btn-dark">Ver Todo</a>
            </div>
        </section>

        <div class="row mb-4">
            <div class="col-md-5">
                <div class="card bg-success text-white shadow-sm border-0">
                    <div class="card-body p-4">
                        <h6 class="text-uppercase small opacity-75 mb-1">💰 Total Ingresos del Periodo</h6>
                        <h2 class="fw-bold mb-0" th:text="${granTotal != null ? '$ ' + #numbers.formatDecimal(granTotal, 0, 'POINT', 0, 'COMMA') : '$ 0'}"></h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-3">ID / Fecha</th>
                            <th>Cliente</th>
                            <th>Productos / Detalle</th>
                            <th class="text-end pe-3">Total Venta</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="v : ${ventas}">
                            <td class="ps-3">
                                <span class="badge bg-secondary mb-1" th:text="'#' + ${v.id}"></span>
                                <div class="small text-muted" th:text="${v.fecha != null ? #temporals.format(v.fecha, 'dd/MM/yyyy HH:mm') : 'Sin fecha'}"></div>
                            </td>
                            <td>
                                <div th:if="${v.cliente != null}">
                                    <span class="fw-bold text-primary" th:text="${v.cliente.nombreCompleto}"></span>
                                    <div class="small text-muted" th:text="${v.cliente.email}"></div>
                                </div>
                                <span th:if="${v.cliente == null}" class="text-muted fst-italic">Venta Rápida</span>
                            </td>
                            <td>
                                <div th:each="detalle : ${v.detalles}" class="small border-bottom py-1">
                                    <span class="fw-bold" th:text="${detalle.cantidad + 'x '}"></span>
                                    <span th:text="${detalle.producto.nombre}"></span>
                                </div>
                            </td>
                            <td class="text-end pe-3">
                                <span class="h6 fw-bold text-dark" th:text="${'$ ' + #numbers.formatDecimal(v.total, 0, 'POINT', 0, 'COMMA')}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div th:if="${#lists.isEmpty(ventas)}" class="p-5 text-center bg-white">
                <i class="bi bi-cash-stack display-4 text-muted opacity-25"></i>
                <p class="mt-3 text-muted">No se registraron movimientos.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
