<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head_comun">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,800;1,900&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* HEADER PREMIUM: 
           Bajamos el z-index a 1040 para que el offcanvas (que por defecto es 1050+) 
           lo cubra totalmente al desplegarse.
        */
        .glass-header {
            position: fixed; top: 20px; left: 2%; right: 2%; height: 85px;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px; 
            z-index: 1040; /* Ajustado para quedar bajo el menú lateral */
            display: flex; align-items: center;
        }

        .brand-logo-btn {
            background: none; border: none; padding: 0; color: white;
            font-family: 'Playfair Display', serif; font-style: italic;
            font-weight: 900; font-size: 1.3rem; line-height: 0.85;
            letter-spacing: 2px; text-align: left; cursor: pointer; transition: 0.3s;
        }

        .nav-link-premium {
            color: white; text-decoration: none; font-size: 0.75rem;
            font-weight: 700; letter-spacing: 1.5px; opacity: 0.75; transition: 0.3s;
        }
        .nav-link-premium:hover { opacity: 1; color: #ffc107; }

        /* MENU LATERAL (OFFCANVAS): 
           Forzamos un ancho más profesional y un color sólido 'La Chefa'.
        */
        #menuPrincipal {
            z-index: 1060 !important; /* Asegura que esté por encima de TODO */
            border-right: 1px solid rgba(255,255,255,0.1);
            width: 300px;
            background-color: #0a0a0a !important; /* Negro sólido como el fondo de las páginas */
        }
    </style>
</head>

<body>
    <header th:fragment="header_premium" class="glass-header">
        <nav class="container-fluid d-flex justify-content-between align-items-center px-lg-5">
            <button class="brand-logo-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuPrincipal">
                LA <br> CHEFA
            </button>
            
            <ul class="nav d-none d-md-flex gap-4 list-unstyled mb-0">
                <li><a th:href="@{/catalogoLaChefa}" class="nav-link-premium">NUESTRO CATÁLOGO</a></li>
                <li><a th:href="@{/recetario}" class="nav-link-premium">RECETARIO</a></li>
                <li sec:authorize="isAnonymous()">
                    <a th:href="@{/registro}" class="nav-link-premium text-warning">CREA TU CUENTA</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <a sec:authorize="isAuthenticated()" th:href="@{/perfil}" class="text-white text-center text-decoration-none">
                    <i class="bi bi-person-check-fill fs-5 text-info"></i>
                    <div style="font-size: 0.6rem; font-weight: 700;">PERFIL</div>
                </a>
                <a sec:authorize="isAnonymous()" th:href="@{/login}" class="text-white text-center text-decoration-none">
                    <i class="bi bi-person-circle fs-5"></i>
                    <div style="font-size: 0.6rem; font-weight: 700;">LOGIN</div>
                </a>
            </div>
        </nav>
    </header>

    <div th:fragment="menu_lateral" class="offcanvas offcanvas-start text-white" tabindex="-1" id="menuPrincipal">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title fw-bold" style="font-family: 'Playfair Display', serif;">MENÚ</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column gap-2">
                <li><a th:href="@{/}" class="nav-link text-white py-3 border-bottom border-secondary opacity-75"><i class="bi bi-house me-2"></i> HOME</a></li>
                <li><a th:href="@{/catalogoLaChefa}" class="nav-link text-white py-3 border-bottom border-secondary opacity-75"><i class="bi bi-shop me-2"></i> CATÁLOGO</a></li>
                <li><a th:href="@{/recetario}" class="nav-link text-white py-3 border-bottom border-secondary opacity-75"><i class="bi bi-journal-text me-2"></i> RECETARIO</a></li>
                
                <li class="mt-4" sec:authorize="hasAuthority('ADMIN')">
				    <a th:href="@{/productos/catalogo}" class="btn btn-danger w-100 fw-bold shadow">
				        <i class="bi bi-shield-lock me-2"></i> PANEL ADMIN
				    </a>
				</li>
            </ul>
        </div>
    </div>
</body>
</html>
