<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments :: head_comun}"></th:block>
    <title th:text="${titulo}">Detalle de Receta</title>
</head>
<body class="bg-light">
    <div th:replace="~{fragments :: nav_publico}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card border-0 shadow-sm overflow-hidden mb-4">
                    <div class="row g-0">
                        <div class="col-md-4 bg-dark d-flex align-items-center justify-content-center text-white">
                            <i class="bi bi-journal-richtext display-1 opacity-50"></i>
                        </div>
                        <div class="col-md-8">
                            <div class="card-body p-4">
                                <span class="badge bg-danger mb-2" th:text="'Salsa Estrella: ' + ${receta.salsa}"></span>
                                <h1 class="fw-bold mb-3" th:text="${receta.nombre}"></h1>
                                <p class="text-muted" th:text="${receta.descripcion}"></p>
                                
                                <div class="d-flex gap-4 mt-4">
                                    <div><i class="bi bi-clock me-2 text-primary"></i> <span th:text="${receta.tiempo}"></span></div>
                                    <div><i class="bi bi-bar-chart me-2 text-primary"></i> <span th:text="${receta.dificultad}"></span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h5 class="fw-bold border-bottom pb-2 mb-3">🛒 Ingredientes</h5>
                                <p style="white-space: pre-line;" th:text="${receta.ingredientes}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h5 class="fw-bold border-bottom pb-2 mb-3">👨‍🍳 Preparación</h5>
                                <p style="white-space: pre-line;" th:text="${receta.instrucciones}"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-5">
                    <a th:href="@{/recetario}" class="btn btn-outline-dark">
                        <i class="bi bi-arrow-left"></i> Volver al Recetario
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
