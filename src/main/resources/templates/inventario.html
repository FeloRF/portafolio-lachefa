<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Gestión La Chefa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .kpi-card { transition: transform 0.2s; border: none; }
        .kpi-card:hover { transform: translateY(-5px); }
        .btn-admin-action { padding: 0.5rem 1.2rem; font-weight: 600; }
        .table-admin thead { background-color: #212529; color: white; }
        /* Miniatura para la imagen por URL */
        .img-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4">
        <header class="row align-items-center mb-4 pb-3 border-bottom g-3">
            <div class="col-md-5">
                <h1 class="h3 mb-0 fw-bold text-dark">
                    <i class="bi bi-speedometer2 me-2 text-danger"></i>Consola de Administración
                </h1>
                <p class="text-muted small mb-0">Gestión de inventario, ventas y contenido culinario</p>
            </div>
            
            <div class="col-md-7 d-flex justify-content-md-end gap-2 flex-wrap">
                <a th:href="@{/productos/nuevo}" class="btn btn-dark btn-admin-action shadow-sm">
    				<i class="bi bi-plus-circle me-1"></i> Nueva Salsa
                </a>
                
                <a th:href="@{/productos/nueva-receta}" class="btn btn-danger btn-admin-action shadow-sm">
                    <i class="bi bi-journal-plus me-1"></i> Nueva Receta 🌶️
                </a>

                <div class="vr mx-2 d-none d-md-block"></div>

                <a th:href="@{/ventas/historial}" class="btn btn-outline-dark btn-sm d-flex align-items-center">
                    <i class="bi bi-clock-history me-1"></i> Historial
                </a>
                <a th:href="@{/}" class="btn btn-outline-secondary btn-sm d-flex align-items-center">
                    <i class="bi bi-house me-1"></i> Home
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link text-danger btn-sm p-0 ms-2 text-decoration-none fw-bold">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </form>
            </div>
        </header>

        <section class="mb-4">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body bg-white">
                    <form th:action="@{/productos/catalogo}" method="get" class="row g-2 align-items-center">
                        <div class="col flex-grow-1">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" name="termino" th:value="${termino}" 
                                       class="form-control border-start-0" placeholder="Buscar salsa por nombre o categoría...">
                            </div>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-dark px-4">Filtrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <div class="row g-3 mb-4 text-center">
            <div class="col-md-4">
                <div class="card kpi-card shadow-sm bg-white p-3 border-bottom border-dark border-4">
                    <h6 class="text-muted text-uppercase small ls-wide">💰 Valor en Bodega</h6>
                    <h3 class="fw-bold mb-0 text-dark" th:text="${'$ ' + #numbers.formatDecimal(valorBodega, 0, 'POINT', 0, 'COMMA')}"></h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card kpi-card shadow-sm bg-success text-white p-3">
                    <h6 class="text-uppercase small ls-wide opacity-75">📈 Ventas Totales</h6>
                    <h3 class="fw-bold mb-0 text-white" th:text="${'$ ' + #numbers.formatDecimal(totalVentas, 0, 'POINT', 0, 'COMMA')}"></h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card kpi-card shadow-sm bg-white p-3 border-bottom border-danger border-4">
                    <h6 class="text-muted text-uppercase small ls-wide">🏺 Variedad Activa</h6>
                    <h3 class="fw-bold mb-0 text-danger" th:text="${variedad + ' SKU'}"></h3>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4 border-0 overflow-hidden" th:if="${ranking != null and !#maps.isEmpty(ranking)}">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0 fs-6"><i class="bi bi-fire me-2 text-warning"></i> SALSAS ESTRELLA</h5>
            </div>
            <div class="card-body bg-white p-0">
                <div class="row g-0">
                    <div th:each="entry : ${ranking}" class="col-md-4 border-end border-bottom">
                        <div class="p-3 d-flex justify-content-between align-items-center" th:if="${entry.key != null}">
                            <div>
                                <span class="fw-bold d-block text-dark" th:text="${entry.key.nombre}"></span>
                                <small class="text-muted text-uppercase" th:text="${entry.key.categoria}" style="font-size: 0.7rem;"></small>
                            </div>
                            <span class="badge bg-danger rounded-pill" th:text="${entry.value + ' unid.'}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
                <h5 class="mb-0 fw-bold">Inventario de Productos</h5>
                <a th:href="@{/productos/papelera}" class="btn btn-outline-secondary btn-sm px-3">
                    <i class="bi bi-trash"></i> Ver Papelera
                </a>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 table-admin">
                    <thead>
                        <tr>
                            <th class="ps-3 border-0">Imagen</th>
                            <th class="border-0">Salsa / Descripción</th>
                            <th class="border-0">Picor</th>
                            <th class="text-center border-0">Stock</th>
                            <th class="text-end border-0">Precio</th>
                            <th class="text-center pe-3 border-0">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr th:each="p : ${productos}">
                            <td class="ps-3">
                                <img th:src="${p.imagenUrl != null && p.imagenUrl != '' ? p.imagenUrl : '/img/no-image.png'}" 
                                     class="img-thumb" alt="Salsa">
                            </td>
                            <td>
                                <span class="fw-bold text-dark d-block" th:text="${p.nombre}"></span>
                                <small class="text-muted text-truncate d-block" style="max-width: 250px;" th:text="${p.descripcion}"></small>
                            </td>
                            <td>
                                <span th:if="${p.nivelPicor > 0}">
                                    <span th:each="i : ${#numbers.sequence(1, p.nivelPicor)}">🌶️</span>
                                </span>
                            </td>
                            <td class="text-center">
                                <span th:text="${p.stock}" 
                                      th:classappend="${p.stock <= 5} ? 'badge bg-danger' : 'fw-bold text-dark'"></span>
                            </td>
                            <td class="text-end fw-bold text-dark" th:text="${'$ ' + #numbers.formatDecimal(p.precio, 0, 'POINT', 0, 'COMMA')}"></td>
                            <td class="text-center pe-3">
                                <div class="btn-group">
                                    <a th:href="@{/ventas/vender/{id}(id=${p.id})}" class="btn btn-sm btn-success"><i class="bi bi-cart-plus"></i></a>
                                    <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-dark"><i class="bi bi-pencil-square"></i></a>
                                    <a th:href="@{/productos/eliminar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash3"></i></a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
