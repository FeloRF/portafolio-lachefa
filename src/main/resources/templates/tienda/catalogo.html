<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments :: head_comun}"></th:block>
    <title>La Chefa - Catálogo de Salsas</title>
    
    <style>
        /* Fondo sólido oscuro */
        body { background-color: #0a0a0a !important; color: #f8f9fa !important; }
        
        /* Estilos de tarjetas adaptados */
        .product-card { 
            background-color: #1a1a1a !important; 
            transition: all 0.3s ease; 
            border: 1px solid #333 !important; 
            border-radius: 20px; 
            overflow: hidden; 
        }
        .product-card:hover { transform: scale(1.03); box-shadow: 0 10px 20px rgba(204,29,29,0.2) !important; }
        .btn-buy { background-color: #cc1d1d; border: none; border-radius: 50px; color: white; }
        .btn-buy:hover { background-color: #a31616; }
        .text-muted { color: #b0b0b0 !important; }
    </style>
</head>
<body>

    <div th:replace="~{fragments :: header_premium}"></div>

    <div style="height: 120px;"></div>

    <header class="py-4 mb-5">
        <div class="container text-center">
            <h1 class="display-5 fw-bold text-white" style="font-family: 'Playfair Display', serif;">Nuestras Salsas y Encurtidos</h1>
            <p class="lead text-muted">Directo desde la cocina de La Chefa a tu mesa.</p>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="p : ${productos}">
                <div class="card h-100 shadow-sm product-card">
                    <div class="bg-dark d-flex align-items-center justify-content-center" style="height: 220px; border-bottom: 1px solid #333;">
                        <i class="bi bi-fire text-danger display-1 opacity-25"></i>
                    </div>
                    
                    <div class="card-body d-flex flex-column p-4">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title fw-bold mb-0 text-uppercase text-white" th:text="${p.nombre}">Nombre</h5>
                            <span class="badge bg-danger small" th:text="${p.categoria}">Categoría</span>
                        </div>
                        
                        <p class="card-text text-muted small flex-grow-1" th:text="${p.descripcion}">Descripción</p>
                        
                        <div class="mb-3">
                            <span class="small fw-bold text-muted">Picor:</span>
                            <span th:if="${p.nivelPicor > 0}">
                                <span th:each="i : ${#numbers.sequence(1, p.nivelPicor)}">🌶️</span>
                            </span>
                            <span th:if="${p.nivelPicor == 0}" class="text-muted fst-italic small">Suave</span>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="h4 fw-bold mb-0 text-danger" 
                                  th:text="${'$ ' + #numbers.formatDecimal(p.precio, 0, 'POINT', 0, 'COMMA')}"></span>
                            <span class="badge bg-secondary" th:if="${p.stock <= 0}">Agotado</span>
                        </div>
                    </div>

                    <div class="card-footer bg-transparent border-0 pb-4 px-4">
                        <a th:href="@{/carrito/agregar/{id}(id=${p.id})}" 
                           class="btn btn-buy w-100 fw-bold py-2"
                           th:classappend="${p.stock <= 0} ? 'disabled btn-dark' : ''">
                           <i class="bi bi-cart-plus me-2"></i> Añadir
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments :: menu_lateral}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
