<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Chefa - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand fw-bold" href="/">🌶️ LA CHEFA</a>
            <div class="d-flex">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm">Acceso Admin</a>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="menuPrincipal">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title fw-bold">MENÚ</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-2">
                    <a href="/" class="nav-link text-white active"><i class="bi bi-house-door me-2"></i> HOME</a>
                </li>
                <li class="nav-item mb-2">
                    <a th:href="@{/catalogoLaChefa}" class="nav-link text-white"><i class="bi bi-shop me-2"></i> CATÁLOGO DE PRODUCTOS</a>
                </li>
                <li class="nav-item mb-2">
                    <a th:href="@{/recetario}" class="nav-link text-white"><i class="bi bi-journal-text me-2"></i> RECETARIO</a>
                </li>
            </ul>
        </div>
    </div>

    <main class="container py-5 text-center">
        <h1 class="display-4 fw-bold mb-4">Bienvenidos a La Chefa</h1>
        <p class="lead">Pronto aquí verás nuestras promociones y el alma de nuestras salsas.</p>
        <a th:href="@{/catalogoLaChefa}" class="btn btn-danger btn-lg mt-3">Ir a la Tienda</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
