<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments :: head_comun}"></th:block>
    <title>Únete a La Chefa</title>
</head>
<body class="bg-light">
    <div th:replace="~{fragments :: nav_publico}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Crear Cuenta 🌶️</h2>
                            <p class="text-muted">Únete para ver recetas exclusivas y guardar tus favoritos.</p>
                        </div>

                        <form th:action="@{/registro}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Nombre Completo</label>
                                <input type="text" name="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" name="email" class="form-control" placeholder="tu@email.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Dirección de Despacho</label>
                                <textarea name="direccion" class="form-control" rows="2" placeholder="Tu calle, número y comuna"></textarea>
                            </div>
                            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Registrarme</button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <span class="small text-muted">¿Ya tienes cuenta? <a th:href="@{/login}" class="text-danger fw-bold">Inicia Sesión</a></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
