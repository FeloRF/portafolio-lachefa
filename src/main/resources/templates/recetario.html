<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <th:block th:replace="~{fragments :: head_comun}"></th:block>
    <link rel="stylesheet" th:href="@{/css/recetario.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments :: header_premium}"></div>

    <main class="container mt-5 pt-5">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold" style="font-family: 'Playfair Display', serif;">Libro de Sabores 🌶️</h1>
            <p class="text-muted">Recetas exclusivas para potenciar tus platos con el toque de La Chefa</p>
            
            <div sec:authorize="hasAuthority('ADMIN')" class="mt-3">
                <a th:href="@{/nueva-receta}" class="btn btn-danger rounded-pill px-4 shadow-sm">
                    <i class="bi bi-plus-circle me-2"></i> AGREGAR NUEVA RECETA
                </a>
            </div>
        </header>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="receta : ${recetas}">
                <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
                    <div class="bg-secondary d-flex align-items-center justify-content-center overflow-hidden" style="height: 200px;">
                        <img th:if="${receta.imagenUrl}" th:src="${receta.imagenUrl}" class="w-100 h-100 object-fit-cover" alt="Salsa">
                        <i th:unless="${receta.imagenUrl}" class="bi bi-image text-white opacity-25" style="font-size: 4rem;"></i>
                    </div>
                    
                    <div class="card-body p-4">
                        <h5 class="fw-bold text-uppercase" th:text="${receta.nombre}">NOMBRE RECETA</h5>
                        
                        <div class="d-grid gap-2">
                            <a th:href="@{/recetario/paso-a-paso/{id}(id=${receta.id})}" class="btn btn-dark rounded-pill">
                                Ver Paso a Paso
                            </a>

                            <div sec:authorize="hasAuthority('ADMIN')" class="d-flex gap-2 mt-2 pt-3 border-top">
                                <a th:href="@{/productos/recetas/editar/{id}(id=${receta.id})}" 
                                   class="btn btn-outline-info btn-sm w-100 rounded-pill">
                                    <i class="bi bi-pencil"></i> Editar
                                </a>
                                <a th:href="@{/productos/recetas/eliminar/{id}(id=${receta.id})}" 
                                   class="btn btn-outline-danger btn-sm w-100 rounded-pill"
                                   onclick="return confirm('¿Estás seguro de eliminar esta receta?')">
                                    <i class="bi bi-trash"></i> Borrar
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments :: menu_lateral}"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
