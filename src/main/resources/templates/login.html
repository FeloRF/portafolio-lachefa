<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Acceso Administrativo - La Chefa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; border-radius: 15px; border: none; }
    </style>
</head>
<body>
    <div class="card login-card shadow">
        <div class="card-body p-5">
            <h2 class="text-center fw-bold mb-4">🌶️ La Chefa</h2>
            <p class="text-center text-muted mb-4">Ingresa tus credenciales de administrador</p>
            
            <div th:if="${param.error}" class="alert alert-danger small">
                Usuario o contraseña incorrectos.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Entrar al Panel</button>
            </form>
            
            <div class="text-center mt-4">
                <a th:href="@{/}" class="text-decoration-none small text-muted">← Volver al Inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
