<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head_comun">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .nav-link:hover { color: #ffc107 !important; transition: 0.3s; }
        .badge-cart { font-size: 0.65rem; padding: 0.35em 0.5em; }
        .offcanvas-body .nav-link { padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 5px; }
        .offcanvas-body .nav-link:hover { background-color: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <nav th:fragment="nav_publico" class="navbar navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <a class="navbar-brand fw-bold fs-4" th:href="@{/}">🌶️ LA CHEFA</a>
            
            <div class="d-flex align-items-center">
                <a th:href="@{/carrito/ver}" class="btn btn-outline-light btn-sm me-2 position-relative border-0">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span th:if="${session.itemsEnCarrito != null && session.itemsEnCarrito > 0}" 
                          th:text="${session.itemsEnCarrito}"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger badge-cart">
                        0
                    </span>
                </a>

                <div sec:authorize="isAnonymous()" class="d-none d-md-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-danger btn-sm px-3 fw-bold">Entrar</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="d-none d-md-flex">
                    <a th:href="@{/perfil}" class="btn btn-outline-warning btn-sm border-0">
                        <i class="bi bi-person-circle fs-5"></i>
                    </a>
                </div>
            </div>

            <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="menuPrincipal">
                <div class="offcanvas-header border-bottom border-secondary">
                    <h5 class="offcanvas-title fw-bold text-danger">MENU LA CHEFA</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
                </div>
                
                <div class="offcanvas-body d-flex flex-column">
                    <ul class="nav nav-pills flex-column mb-auto">
                        <li class="nav-item">
                            <a th:href="@{/}" class="nav-link text-white"><i class="bi bi-house-door me-3"></i> HOME</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/catalogoLaChefa}" class="nav-link text-white"><i class="bi bi-shop me-3"></i> CATALOGO</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/recetario}" class="nav-link text-white"><i class="bi bi-journal-text me-3"></i> RECETARIO</a>
                        </li>
                        
                        <hr class="border-secondary my-4">
                        
                        <div sec:authorize="isAnonymous()">
                            <li class="nav-item">
                                <a th:href="@{/registro}" class="nav-link text-warning fw-bold"><i class="bi bi-person-plus me-3"></i> CREAR CUENTA</a>
                            </li>
                            <li class="nav-item">
                                <a th:href="@{/login}" class="nav-link text-white"><i class="bi bi-box-arrow-in-right me-3"></i> INICIAR SESIÓN</a>
                            </li>
                        </div>

                        <div sec:authorize="isAuthenticated()">
                            <li class="nav-item">
                                <a th:href="@{/perfil}" class="nav-link text-info"><i class="bi bi-person-vcard me-3"></i> MI PERFIL</a>
                            </li>
                        </div>

                        <li class="nav-item mt-2" sec:authorize="hasAuthority('ADMIN')">
                            <a class="nav-link bg-danger text-white fw-bold shadow-sm" th:href="@{/productos/catalogo}">
                                <i class="bi bi-gear-fill me-3"></i> PANEL ADMIN
                            </a>
                        </li>
                        
                        <li sec:authorize="isAuthenticated()" class="mt-5">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="btn btn-outline-danger w-100 text-start py-2">
                                    <i class="bi bi-power me-3"></i> CERRAR SESIÓN
                                </button>
                            </form>
                        </li>
                    </ul>
                    
                    <div class="mt-auto text-center pb-3">
                        <small class="text-muted opacity-50">La Chefa v1.6 - 2026</small>
                    </div>
                </div>
            </div>
        </div>
    </nav>

</body>
</html>
