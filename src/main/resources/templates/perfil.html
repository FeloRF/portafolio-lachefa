<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments :: head_comun}"></th:block>
    <title>Mi Perfil - La Chefa</title>
    <style>
        .profile-card { border-radius: 25px; border: none; overflow: hidden; }
        .profile-header { background: linear-gradient(135deg, #1a1a1a 0%, #cc1d1d 100%); height: 130px; }
        .profile-avatar { width: 110px; height: 110px; margin-top: -55px; border: 6px solid white; background-color: #f8f9fa; }
    </style>
</head>
<body class="bg-light">

    <div th:replace="~{fragments :: header_premium}"></div>

    <div class="container py-5 mt-5">
        <div class="row justify-content-center pt-5">
            <div class="col-md-6 col-lg-5">
                
                <div class="card profile-card shadow-lg">
                    <div class="profile-header"></div>
                    
                    <div class="card-body text-center pt-0">
                        <div class="profile-avatar rounded-circle d-flex align-items-center justify-content-center mx-auto shadow-sm">
                            <i class="bi bi-person-fill display-4 text-danger"></i>
                        </div>

                        <h3 class="fw-bold mt-3 mb-1" th:text="${usuario.nombreCompleto}">Nombre del Usuario</h3>
                        <span th:classappend="${usuario.rol.name() == 'ADMIN'} ? 'badge bg-danger' : 'badge bg-dark'" 
                              class="px-4 py-2 mb-4 rounded-pill shadow-sm" 
                              th:text="${usuario.rol.name() == 'ADMIN' ? '🌶️ ADMINISTRADOR' : '🍴 CATADOR OFICIAL'}">
                        </span>

                        <div class="text-start px-3 mt-3">
                            <div class="mb-3 border-bottom pb-2">
                                <label class="small fw-bold text-muted text-uppercase">Email</label>
                                <p class="mb-0 fw-semibold" th:text="${usuario.email}"></p>
                            </div>

                            <div class="mb-3 border-bottom pb-2">
                                <label class="small fw-bold text-muted text-uppercase">Ubicación</label>
                                <p class="mb-0 fw-semibold" th:text="${usuario.direccion}">No registrada</p>
                            </div>
                        </div>

                        <div class="d-grid gap-2 px-3 mt-4">
                            <div sec:authorize="hasAuthority('ADMIN')">
                                <a th:href="@{/productos/catalogo}" class="btn btn-danger w-100 py-2 fw-bold">
                                    <i class="bi bi-gear-fill me-2"></i> GESTIONAR TIENDA
                                </a>
                            </div>
                            <div sec:authorize="hasAuthority('CLIENTE')">
                                <a th:href="@{/carrito/ver}" class="btn btn-dark w-100 py-2 fw-bold mb-2">
                                    <i class="bi bi-bag-check me-2"></i> VER MIS COMPRAS
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 text-center pb-4">
                        <a th:href="@{/}" class="text-decoration-none text-muted small">
                            <i class="bi bi-arrow-left me-1"></i> Volver a la página principal
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: menu_lateral}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
