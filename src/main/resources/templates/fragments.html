<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head_comun">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .nav-link:hover { color: #ffc107 !important; }
        .badge-cart { font-size: 0.6rem; }
    </style>
</head>
<body>

    <nav th:fragment="nav_publico" class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <a class="navbar-brand fw-bold" th:href="@{/}">🌶️ LA CHEFA</a>
            
            <div class="d-flex align-items-center">
                <a th:href="@{/carrito/ver}" class="btn btn-outline-light btn-sm me-3 position-relative border-0">
                    <i class="bi bi-cart fs-5"></i>
                    <span th:if="${session.itemsEnCarrito != null && session.itemsEnCarrito > 0}" 
                          th:text="${session.itemsEnCarrito}"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger badge-cart">
                        0
                    </span>
                </a>

                <div sec:authorize="isAnonymous()" class="d-none d-md-flex gap-2">
                    <a th:href="@{/registro}" class="btn btn-outline-warning btn-sm fw-bold">Registrarme</a>
                    <a th:href="@{/login}" class="btn btn-danger btn-sm">Entrar</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                    <a th:href="@{/perfil}" class="btn btn-outline-info btn-sm me-2">
                        <i class="bi bi-person-circle me-1"></i> Mi Perfil
                    </a>
                </div>
            </div>

            <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="menuPrincipal">
                <div class="offcanvas-header border-bottom border-secondary">
                    <h5 class="offcanvas-title fw-bold text-danger">MENÚ LA CHEFA</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body d-flex flex-column">
                    <ul class="nav nav-pills flex-column mb-auto">
                        <li class="nav-item mb-2">
                            <a th:href="@{/}" class="nav-link text-white"><i class="bi bi-house-door me-2"></i> HOME</a>
                        </li>
                        <li class="nav-item mb-2">
                            <a th:href="@{/catalogoLaChefa}" class="nav-link text-white"><i class="bi bi-shop me-2"></i> CATÁLOGO</a>
                        </li>
                        <li class="nav-item mb-2">
                            <a th:href="@{/recetario}" class="nav-link text-white"><i class="bi bi-journal-text me-2"></i> RECETARIO</a>
                        </li>
                        
                        <hr class="border-secondary">
                        <li sec:authorize="isAnonymous()" class="nav-item mb-2">
                            <a th:href="@{/registro}" class="nav-link text-warning fw-bold"><i class="bi bi-person-plus me-2"></i> CREAR CUENTA</a>
                        </li>
                        <li sec:authorize="isAnonymous()" class="nav-item mb-2">
                            <a th:href="@{/login}" class="nav-link text-white"><i class="bi bi-box-arrow-in-right me-2"></i> INICIAR SESIÓN</a>
                        </li>

                        <li sec:authorize="isAuthenticated()" class="nav-item mb-2">
                            <a th:href="@{/perfil}" class="nav-link text-info"><i class="bi bi-person-vcard me-2"></i> MI PERFIL</a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')" class="nav-item mb-2">
                            <a th:href="@{/productos/catalogo}" class="nav-link text-danger"><i class="bi bi-shield-lock me-2"></i> PANEL ADMIN</a>
                        </li>
                        <li sec:authorize="isAuthenticated()" class="mt-4">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="btn btn-outline-danger w-100 text-start">
                                    <i class="bi bi-power me-2"></i> CERRAR SESIÓN
                                </button>
                            </form>
                        </li>
                    </ul>
                    
                    <div class="mt-auto text-center pb-3">
                        <small class="text-muted">La Chefa v1.5 - 2026</small>
                    </div>
                </div>
            </div>
        </div>
    </nav>

</body>
</html>
