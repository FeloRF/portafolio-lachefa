<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Logística POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        
        <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <div>
                <a th:href="@{/productos/catalogo}" class="btn btn-sm btn-outline-secondary mb-2"><i class="bi bi-arrow-left"></i> Volver</a>
                <h2 class="mb-0 fw-bold"><i class="bi bi-shop text-danger me-2"></i><span th:text="${pos.nombre}"></span></h2>
                <p class="text-muted mb-0"><i class="bi bi-geo-alt"></i> <span th:text="${pos.ubicacion}"></span></p>
            </div>
            <div class="text-end">
                <span class="badge fs-6 rounded-pill mb-2" 
                      th:classappend="${pos.estado.name() == 'ACTIVO' ? 'bg-success' : (pos.estado.name() == 'PLANIFICADO' ? 'bg-info text-dark' : 'bg-secondary')}" 
                      th:text="${pos.estado.name()}"></span>
                <p class="mb-0 small fw-bold">Vendedor: <span class="text-primary" th:text="${pos.vendedorPrincipal != null ? pos.vendedorPrincipal.nombreCompleto : 'Sin Asignar'}"></span></p>
            </div>
        </header>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-4 mb-4">
            <!-- Operaciones Logísticas -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0 fs-6"><i class="bi bi-box-seam me-2"></i>Operaciones de Stock</h5>
                    </div>
                    <div class="card-body">
                        
                        <!-- Despacho a POS -->
                        <h6 class="fw-bold mb-3 border-bottom pb-2 text-primary"><i class="bi bi-arrow-right-circle me-1"></i> Despachar a POS</h6>
                        <form th:action="@{/admin/pos/{id}/despachar(id=${pos.id})}" method="post" class="mb-4">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Producto desde Bodega</label>
                                <select class="form-select form-select-sm" name="productoId" required>
                                    <option value="">Seleccione Producto...</option>
                                    <option th:each="prod : ${productosBodega}" 
                                            th:value="${prod.id}" 
                                            th:text="${prod.nombre} + ' (Stock Bodega: ' + ${prod.stock} + ')'"
                                            th:disabled="${prod.stock == 0}"></option>
                                </select>
                            </div>
                            <div class="row g-2 align-items-center">
                                <div class="col-8">
                                    <input type="number" class="form-control form-control-sm" name="cantidad" placeholder="Cantidad a enviar" min="1" required>
                                </div>
                                <div class="col-4 d-grid">
                                    <button type="submit" class="btn btn-primary btn-sm fw-bold">Enviar</button>
                                </div>
                            </div>
                        </form>

                        <!-- Devolución a Bodega -->
                        <h6 class="fw-bold mb-3 border-bottom pb-2 text-secondary"><i class="bi bi-arrow-left-circle me-1"></i> Devolver a Bodega</h6>
                        <form th:action="@{/admin/pos/{id}/devolver(id=${pos.id})}" method="post">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Producto en POS</label>
                                <select class="form-select form-select-sm" name="productoId" required>
                                    <option value="">Seleccione Producto...</option>
                                    <option th:each="item : ${inventario}" 
                                            th:value="${item.producto.id}" 
                                            th:text="${item.producto.nombre} + ' (Saldo POS: ' + ${item.stockActual} + ')'"
                                            th:disabled="${item.stockActual == 0}"></option>
                                </select>
                            </div>
                            <div class="row g-2 align-items-center">
                                <div class="col-8">
                                    <input type="number" class="form-control form-control-sm" name="cantidad" placeholder="Cantidad a devolver" min="1" required>
                                </div>
                                <div class="col-4 d-grid">
                                    <button type="submit" class="btn btn-secondary btn-sm fw-bold">Devolver</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Inventario Local -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fs-6 fw-bold text-dark"><i class="bi bi-clipboard2-data me-2"></i>Inventario Local Asignado</h5>
                        <span class="badge bg-light text-dark border">Total Items: <span th:text="${inventario.size()}"></span></span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Producto (SKU)</th>
                                    <th>Categoría</th>
                                    <th class="text-center">Stock POS</th>
                                    <th class="text-center">Alerta CRO</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${inventario}">
                                    <td class="ps-3 fw-bold" th:text="${item.producto.nombre}"></td>
                                    <td><span class="badge bg-light text-secondary border" th:text="${item.producto.categoria}"></span></td>
                                    <td class="text-center">
                                        <span class="fs-5 fw-bold" th:text="${item.stockActual}"></span>
                                    </td>
                                    <td class="text-center">
                                        <span th:if="${item.stockActual <= pos.umbralStockCritico}" class="badge bg-danger rounded-pill"><i class="bi bi-exclamation-triangle me-1"></i>Crítico</span>
                                        <span th:if="${item.stockActual > pos.umbralStockCritico}" class="badge bg-success rounded-pill">OK</span>
                                    </td>
                                </tr>
                                <tr th:if="${inventario.empty}">
                                    <td colspan="4" class="text-center text-muted py-5">
                                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                        Aún no hay stock asignado a este Punto de Venta.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
