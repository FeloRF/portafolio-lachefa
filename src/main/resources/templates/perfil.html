<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments :: head_comun}"></th:block>
    <title th:text="${titulo}">Mi Perfil - La Chefa</title>
    <style>
        .profile-card { border-radius: 20px; border: none; overflow: hidden; }
        .profile-header { background: linear-gradient(135.5deg, #212529 0%, #dc3545 100%); height: 120px; }
        .profile-avatar { width: 100px; height: 100px; margin-top: -50px; border: 5px solid white; background-color: #f8f9fa; }
        .info-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #6c757d; font-weight: bold; }
    </style>
</head>
<body class="bg-light">

    <div th:replace="~{fragments :: nav_publico}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card profile-card shadow-lg">
                    <div class="profile-header"></div>
                    
                    <div class="card-body text-center pt-0">
                        <div class="profile-avatar rounded-circle d-flex align-items-center justify-content-center mx-auto shadow-sm">
                            <i class="bi bi-person-fill display-4 text-danger"></i>
                        </div>

                        <h3 class="fw-bold mt-3 mb-1" th:text="${usuario.nombreCompleto}">Nombre del Usuario</h3>
                        <span th:classappend="${usuario.rol.name() == 'ADMIN'} ? 'badge bg-danger' : 'badge bg-dark'" 
                              class="px-3 py-2 mb-4" 
                              th:text="${usuario.rol.name() == 'ADMIN' ? '🌶️ ADMINISTRADOR' : '🍴 CATADOR OFICIAL'}">
                        </span>

                        <div class="text-start px-3">
                            <div class="mb-3 border-bottom pb-2">
                                <p class="info-label mb-0">Correo Electrónico</p>
                                <p class="mb-0 fw-semibold text-dark" th:text="${usuario.email}"></p>
                            </div>

                            <div class="mb-3 border-bottom pb-2">
                                <p class="info-label mb-0">Dirección de Despacho</p>
                                <p class="mb-0 fw-semibold text-dark" th:text="${usuario.direccion}">No registrada</p>
                            </div>

                            <div class="mb-3">
                                <p class="info-label mb-0">Nombre de Usuario</p>
                                <p class="mb-0 fw-semibold text-dark" th:text="${usuario.username}">---</p>
                            </div>
                        </div>

                        <hr class="my-4 opacity-25">

                        <div sec:authorize="hasAuthority('ADMIN')" class="d-grid gap-2">
                            <a th:href="@{/productos/catalogo}" class="btn btn-danger py-2 fw-bold shadow-sm">
                                <i class="bi bi-speedometer2 me-2"></i> IR AL PANEL DE CONTROL
                            </a>
                        </div>

                        <div sec:authorize="hasAuthority('CLIENTE')" class="d-grid gap-2">
                            <a th:href="@{/carrito/ver}" class="btn btn-dark py-2 fw-bold mb-2">
                                <i class="bi bi-bag-check me-2"></i> VER MIS COMPRAS
                            </a>
                            <button class="btn btn-outline-secondary btn-sm border-0">
                                <i class="bi bi-pencil-square me-1"></i> Editar mis datos
                            </button>
                        </div>

                    </div>
                    <div class="card-footer bg-white border-0 text-center pb-4">
                        <small class="text-muted">Miembro desde: Feb 2026</small>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a th:href="@{/}" class="text-decoration-none text-muted small">
                        <i class="bi bi-arrow-left me-1"></i> Volver a la tienda
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
