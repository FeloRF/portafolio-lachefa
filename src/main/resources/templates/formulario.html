<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <th:block th:replace="~{fragments :: head_comun}"></th:block>
    <title th:text="${titulo}">La Chefa - Admin</title>
    <style>
        /* Consistencia Dark Mode La Chefa */
        body { background-color: #0a0a0a !important; color: #f8f9fa !important; }
        .card { background-color: #1a1a1a !important; color: white !important; border: 1px solid #333 !important; }
        .form-control, .form-select, .input-group-text { 
            background-color: #2b2b2b !important; 
            border-color: #444 !important; 
            color: white !important; 
        }
        .form-control:focus, .form-select:focus { 
            border-color: #ffc107 !important; 
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.15) !important; 
        }
        label { color: #ffc107 !important; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .btn-dark { background-color: #cc1d1d !important; border: none; font-weight: 700; }
        .btn-dark:hover { background-color: #a31616 !important; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div th:replace="~{fragments :: header_premium}"></div>

	    <div class="container py-5 mt-5">
	        <div class="row justify-content-center pt-4">
	            <div class="col-lg-8">
	                <div class="d-flex align-items-center mb-4">
	                    <a th:href="@{/productos/catalogo}" class="btn btn-outline-warning btn-sm me-3 rounded-pill">
	                        <i class="bi bi-arrow-left"></i> VOLVER
	                    </a>
	                    <h1 class="h3 mb-0 text-white" th:text="${titulo}" style="font-family: 'Playfair Display', serif;">Registrar Producto</h1>
	                </div>
	
	                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
	                    <div class="card-body p-4 p-md-5">
	                        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
	                            
	                            <input type="hidden" th:field="*{id}" />
	
	                            <div class="row g-4">
	                                <div class="col-md-12">
	                                    <label class="form-label">Nombre de la Salsa o Encurtido</label>
	                                    <input type="text" th:field="*{nombre}" class="form-control form-control-lg" 
	                                           placeholder="Ej: Habanero del Infierno" required>
	                                    <div class="text-danger small" th:if="${#fields != null and #fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
	                                </div>
	
	                                <div class="col-md-12">
	                                    <label class="form-label">URL de la Imagen (Link Público)</label>
	                                    <div class="input-group">
	                                        <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
	                                        <input type="url" th:field="*{imagenUrl}" class="form-control" 
	                                               placeholder="https://imgur.com/foto-salsa.jpg" required>
	                                    </div>
	                                    <small class="text-white-50">Sube tu foto a un servidor externo y pega el link aquí.</small>
	                                </div>
	
	                                <div class="col-md-12">
	                                    <label class="form-label">Descripción del Sabor</label>
	                                    <textarea th:field="*{descripcion}" class="form-control" rows="3" 
	                                              placeholder="Describe matices, ingredientes y maridaje..."></textarea>
	                                </div>
	
	                                <div class="col-md-6">
	                                    <label class="form-label">Nivel de Picor</label>
	                                    <div class="input-group">
	                                        <span class="input-group-text"><i class="bi bi-fire text-danger"></i></span>
	                                        <select th:field="*{nivelPicor}" class="form-select">
	                                            <option value="0">0 - Sin picor</option>
	                                            <option value="1">1 - Apenas pica 🔥</option>
	                                            <option value="2">2 - Picante medio 🔥🔥</option>
	                                            <option value="3">3 - Picante fuerte 🔥🔥🔥</option>
	                                            <option value="4">4 - Muy picante 🔥🔥🔥🔥</option>
	                                            <option value="5">5 - ¡Extra Picante! 🔥🔥🔥🔥🔥</option>
	                                        </select>
	                                    </div>
	                                </div>
	
	                                <div class="col-md-6">
	                                    <label class="form-label">Categoría</label>
	                                    <select th:field="*{categoria}" class="form-select">
	                                        <option value="Salsa Roja">Salsa Roja</option>
	                                        <option value="Salsa Verde">Salsa Verde</option>
	                                        <option value="Encurtido">Encurtido</option>
	                                        <option value="Aceite Picante">Aceite Picante</option>
	                                        <option value="Mermeladas">Mermeladas</option>
	                                        <option value="Confituras">Confituras</option>
	                                    </select>
	                                </div>
	
	                                <div class="col-md-6">
	                                    <label class="form-label">Stock Inicial</label>
	                                    <input type="number" th:field="*{stock}" class="form-control" min="0" required>
	                                </div>
	                                
	                                <div class="col-md-6">
	                                    <label class="form-label">Precio (CLP)</label>
	                                    <div class="input-group">
	                                        <span class="input-group-text">$</span>
	                                        <input type="number" th:field="*{precio}" class="form-control" min="0" required>
	                                    </div>
	                                </div>
	                            </div>
	
	                            <div class="d-flex justify-content-between align-items-center mt-5">
	                                <a th:href="@{/productos/catalogo}" class="text-white-50 text-decoration-none small">
	                                    <i class="bi bi-x-circle me-1"></i> DESCARTAR CAMBIOS
	                                </a>
	                                <button type="submit" class="btn btn-dark px-5 py-2 rounded-pill shadow-sm">
	                                    <i class="bi bi-save2-fill me-2"></i> GUARDAR EN CATÁLOGO
	                                </button>
	                            </div>
	                        </form>
	                    </div>
	                </div>
	            </div>
	        </div>
	    </div>
    </body>
</html>
