<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Checkout</title>
</head>
<body style="font-family: sans-serif; padding: 30px; background: #fdf2f2;">
    <main style="max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2 style="color: #e11d48; text-align: center;">Datos de Envío</h2>
        <form th:action="@{/checkout/pagar}" method="post">
            <div style="margin-bottom: 15px;">
                <label>Nombre Completo:</label>
                <input type="text" name="nombre" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Email (Identificador):</label>
                <input type="email" name="email" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label>Dirección de Despacho:</label>
                <input type="text" name="direccion" required style="width: 100%; padding: 8px;">
            </div>
            <div style="background: #f1f5f9; padding: 15px; text-align: center; border-radius: 5px;">
                <strong>Total a pagar: </strong>
                <span th:text="${'$ ' + total}" style="font-size: 1.5em; color: #e11d48;"></span>
            </div>
            <button type="submit" style="width: 100%; margin-top: 20px; background: #16a34a; color: white; padding: 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                CONFIRMAR Y PAGAR 💳
            </button>
        </form>
    </main>
</body>
</html>
