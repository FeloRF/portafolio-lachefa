
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <th:block th:replace="~{fragments :: head_comun}"></th:block>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <title>La Chefa - Home</title>
</head>
<body class="home-page">

    <header th:replace="~{fragments :: header_premium}"></header>

    <div id="bgCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <div class="bg-img" th:style="'background-image: url(' + @{/img/bgFruti.png} + ');'"></div>
            </div>
            <div class="carousel-item">
                <div class="bg-img" th:style="'background-image: url(' + @{/img/bgJalea.png} + ');'"></div>
            </div>
            <div class="carousel-item">
                <div class="bg-img" th:style="'background-image: url(' + @{/img/bgPiña.png} + ');'"></div>
            </div>
        </div>
    </div>

    <main class="hero-container">
        <div class="text-content">
            <h1 class="main-title">
                LA <br> <span>CHEFA</span>
            </h1>
            <p class="main-paragraph">
                Salsas artesanales creadas con ingredientes locales...
            </p>
            <div class="mt-4">
                <a th:href="@{/catalogoLaChefa}" class="btn btn-outline-light rounded-pill px-4 py-2 fw-bold">
                    EXPLORAR TIENDA
                </a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments :: menu_lateral}"></div>

    <footer class="footer-minimal">FELIPE ROJAS FLORES | LA CHEFA PROJECT 2026</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
